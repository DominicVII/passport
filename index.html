function validImage(v) {
  if (typeof v !== "string") return "";
  if (/^data:image\/(png|jpeg|webp|gif);base64,/.test(v)) return v;
  if (/^assets\/[A-Za-z0-9._-]+$/.test(v)) return v;
  return "";
}

function normalize(raw) {
  const s = { entries: [], compass: {}, books: [], news: { follow: [] } };
  if (!raw || typeof raw !== "object") return s;
  if (Array.isArray(raw.entries)) {
    s.entries = raw.entries.filter(e => e && e.id && KINDS[e.kind]).map(e => ({
      id: String(e.id), kind: e.kind, title: String(e.title || "Untitled"),
      date: e.date || null,
      link: /^https:\/\//.test(e.link || "") ? String(e.link) : "",
      body: String(e.body || ""), image: validImage(e.image),
      created: e.created || new Date().toISOString(),
    }));
  }
  if (raw.compass && typeof raw.compass === "object") {
    COMPASS_QUESTIONS.forEach(q => {
      const v = Number(raw.compass[q.id]);
      if (v >= 1 && v <= 5) s.compass[q.id] = v;
    });
  }
  if (Array.isArray(raw.books)) {
    s.books = raw.books.filter(b => b && b.id).map(b => ({
      id: String(b.id), title: String(b.title || "Untitled"),
      chapters: Array.isArray(b.chapters) ? b.chapters.filter(c => c && c.id).map(c => ({
        id: String(c.id), title: String(c.title || "Untitled"), body: String(c.body || ""),
      })) : [],
    }));
  }
  if (raw.news && Array.isArray(raw.news.follow)) s.news.follow = raw.news.follow.map(String);
  return s;
}

function load() {
  try { return normalize(JSON.parse(localStorage.getItem(KEY) || "null")); } catch (e) { return normalize(null); }

function persist() {

// Resizes to at most 640px and stores as JPEG on white, so transparent PNGs stay readable.
function readImage(file) {
  return new Promise((resolve, reject) => {
    if (!file.type.startsWith("image/")) return reject(new Error("Pick an image file."));
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, 640 / Math.max(img.width, img.height));
      const canvas = document.createElement("canvas");
      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#fff";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(url);
      resolve(canvas.toDataURL("image/jpeg", 0.85));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Couldn't read that image.")); };
    img.src = url;
  });
}

  const file = document.getElementById("fImage").files[0];
  if (file) {

}

/* ---------- compass ---------- */

function compassScores() {
  const axes = Object.keys(COMPASS_AXES);
  const out = {};
  const count = {};
  axes.forEach(a => { out[a] = 0; count[a] = 0; });
  COMPASS_QUESTIONS.forEach(q => {
    const a = state.compass[q.id];
    if (!a) return;
    out[q.axis] += (a - 3) * q.dir;
    count[q.axis] += 1;
  });
  // Each statement moves its axis by at most 2 (a 1 or 5 answer), so a full axis ranges over -1 to 1.
  const res = { answered: COMPASS_QUESTIONS.filter(q => state.compass[q.id]).length };
  axes.forEach(a => { res[a] = count[a] ? out[a] / (count[a] * 2) : null; });
  return res;
}

function readoutHtml(sc) {
  return Object.entries(COMPASS_AXES).map(([key, axis]) => `
    <div class="match"><span>${esc(axis.title)}</span><small>${fmtScore(sc[key], axis)}</small></div>`).join("");
}

function plotSvg(you) {
  const size = 280, pad = 24, inner = size - pad * 2;
  const x = v => pad + ((v + 1) / 2) * inner;
  const y = v => pad + (1 - (v + 1) / 2) * inner;
  const marks = FIGURES.map(f => `
    <circle cx="${x(f.econ)}" cy="${y(f.liberty)}" r="4" fill="none" stroke="var(--slate)" stroke-width="1.2"/>
    <text x="${x(f.econ) + 6}" y="${y(f.liberty) + 3}" font-size="9" fill="var(--muted)">${esc(f.name.split(" ").slice(-1)[0])}</text>`).join("");
  const dot = you ? `<circle cx="${x(you.econ)}" cy="${y(you.liberty)}" r="6" fill="var(--imperial)"/>
    <text x="${x(you.econ) + 9}" y="${y(you.liberty) - 6}" font-size="11" font-weight="700" fill="var(--ink)">You</text>` : "";
  return `
    <svg class="plot" viewBox="0 0 ${size} ${size}" role="img" aria-label="Political compass">
      <rect x="${pad}" y="${pad}" width="${inner}" height="${inner}" fill="none" stroke="var(--line-strong)"/>
      <line x1="${pad + inner / 2}" y1="${pad}" x2="${pad + inner / 2}" y2="${pad + inner}" stroke="var(--line)"/>
      <line x1="${pad}" y1="${pad + inner / 2}" x2="${pad + inner}" y2="${pad + inner / 2}" stroke="var(--line)"/>
      <text x="${pad}" y="${size - 6}" font-size="10" fill="var(--muted)">${COMPASS_AXES.econ.low}</text>
      <text x="${pad + inner}" y="${size - 6}" font-size="10" fill="var(--muted)" text-anchor="end">${COMPASS_AXES.econ.high}</text>
      <text x="${pad + 4}" y="${pad + 12}" font-size="10" fill="var(--muted)">${COMPASS_AXES.liberty.low}</text>
      <text x="${pad + 4}" y="${pad + inner - 4}" font-size="10" fill="var(--muted)">${COMPASS_AXES.liberty.high}</text>
      ${marks}${dot}
    </svg>`;
}

function fmtScore(v, axis) {
  const pct = Math.round(Math.abs(v) * 100);
  if (pct < 10) return "near center";
  return `${pct}% ${v > 0 ? axis.high : axis.low}`;
}

// The statement on screen: the first unanswered one, unless the reader has moved with Back or Next.
const currentQIndex = () => {
  if (ui.qIndex !== null) return ui.qIndex;
  const open = COMPASS_QUESTIONS.findIndex(q => !state.compass[q.id]);
  return open < 0 ? 0 : open;
};

function compassHtml() {
  const sc = compassScores();
  const complete = sc.answered === COMPASS_QUESTIONS.length;
  const you = complete ? { econ: sc.econ, liberty: sc.liberty } : null;
  const ranked = you
    ? FIGURES.map(f => ({ f, d: figureDistance(f, sc) })).sort((a, b) => a.d - b.d).slice(0, 3)
    : [];
  const result = complete
    ? `<div class="card">
         <h2>Where you stand</h2>
         ${readoutHtml(sc)}
         ${plotSvg(you)}
         <div class="section-sub" style="margin-top:6px">Closest reference points</div>
         ${ranked.map(r => `<div class="match"><span>${esc(r.f.name)}</span><small>${closeness(r.d)}% close overall</small></div>`).join("")}
         <div class="muted" style="margin-top:10px">Matches compare all five dimensions. Reference placements are rough and editable in the app's source. Use this to reflect, not to settle anything.</div>
       </div>`
    : `<div class="card"><div class="empty">Answer all ${COMPASS_QUESTIONS.length} statements to see where you stand. ${sc.answered} of ${COMPASS_QUESTIONS.length} answered.</div></div>`;
  const qi = currentQIndex();
  const q = COMPASS_QUESTIONS[qi];
  const last = COMPASS_QUESTIONS.length - 1;
  const pct = Math.round((sc.answered / COMPASS_QUESTIONS.length) * 100);
  const questionCard = `
    <div class="card">
      <div class="muted">${sc.answered} of ${COMPASS_QUESTIONS.length} answered</div>
      <div style="height:8px;margin:6px 0 12px;background:var(--parchment-2);border:0.5px solid var(--line);border-radius:6px;overflow:hidden"><i style="display:block;height:100%;width:${pct}%;background:var(--imperial)"></i></div>
      <div class="muted">Statement ${qi + 1} of ${COMPASS_QUESTIONS.length} · ${esc(COMPASS_AXES[q.axis].title)}</div>
      <div class="q-text" style="margin-top:8px;font-size:17px">${esc(q.text)}</div>
      <div class="scale" role="radiogroup" aria-label="${esc(q.text)}">
        ${[1, 2, 3, 4, 5].map(n => `<label><input type="radio" name="q${q.id}" value="${n}" data-field="compass" data-id="${q.id}" ${state.compass[q.id] === n ? "checked" : ""}>${n}</label>`).join("")}
      </div>
      <div class="scale-ends"><span>Strongly disagree</span><span>Strongly agree</span></div>
      <div class="row" style="margin-top:14px"><button class="ui" data-action="q-prev" ${qi === 0 ? "disabled" : ""}>Back</button><button class="ui" data-action="q-next" ${qi === last ? "disabled" : ""}>Next</button></div>
    </div>`;
  return `
    <div class="section-label">Political compass</div>
    <div class="section-sub">Answer one statement at a time. Choosing a number moves you to the next statement.</div>
    ${result}
    ${questionCard}
    ${complete ? `<div class="foot"><button class="ui" data-action="compass-reset">Clear answers</button></div>` : ""}`;
}

/* ---------- writing ---------- */

function bookWords(b) { return b.chapters.reduce((n, c) => n + wordCount(c.body), 0); }

function writingHtml() {
  if (ui.openBook) {
    const b = state.books.find(x => x.id === ui.openBook);
    if (b) return bookHtml(b);
    ui.openBook = null;
  }
  const q = ui.bookQuery.trim().toLowerCase();
  const matches = state.books.filter(b =>
    !q || b.title.toLowerCase().includes(q) || b.chapters.some(c => c.title.toLowerCase().includes(q) || c.body.toLowerCase().includes(q)));
  return `
    <div class="section-label">Writing</div>
    <div class="section-sub">Books, chapters, and drafts. Saved on this device; export any book as Markdown.</div>
    <div class="search"><input type="search" id="bookSearch" placeholder="Search books and chapters" value="${esc(ui.bookQuery)}"></div>
    <div class="card">
      ${matches.map(b => `
        <div class="book-row">
          <div>
            <button class="link" data-action="open-book" data-id="${esc(b.id)}" style="margin:0;font-size:15px;font-weight:700;color:var(--ink);text-decoration:none">${esc(b.title)}</button>
            <div class="meta">${b.chapters.length} chapter${b.chapters.length === 1 ? "" : "s"} · ${bookWords(b).toLocaleString()} words</div>
          </div>
        </div>`).join("") || `<div class="empty">${state.books.length ? "No matches." : "No books yet. Start one below."}</div>`}
      <div class="row">
        <input type="text" id="newBookTitle" placeholder="New book title">
        <button class="ui primary" data-action="add-book">Start book</button>
      </div>
    </div>`;
}

function bookHtml(b) {
  const chapters = b.chapters.map(c => `
    <div class="card">
      <div class="row" style="margin-top:0">
        <input type="text" value="${esc(c.title)}" data-field="chapter-title" data-book="${esc(b.id)}" data-id="${esc(c.id)}" aria-label="Chapter title">
        <span class="meta">${wordCount(c.body).toLocaleString()} words</span>
      </div>
      <label class="field">Text
        <textarea data-field="chapter-body" data-book="${esc(b.id)}" data-id="${esc(c.id)}">${esc(c.body)}</textarea>
      </label>
      <div class="row"><button class="link" data-action="delete-chapter" data-book="${esc(b.id)}" data-id="${esc(c.id)}">Delete chapter</button></div>
    </div>`).join("");
  return `
    <div class="row" style="margin-top:0"><button class="ui" data-action="close-book">← All books</button></div>
    <div class="section-label" style="margin-top:14px">${esc(b.title)}</div>
    <div class="section-sub">${bookWords(b).toLocaleString()} words across ${b.chapters.length} chapter${b.chapters.length === 1 ? "" : "s"}</div>
    ${ponderHtml(`For ${b.title}`)}
    ${chapters || `<div class="empty">No chapters yet.</div>`}
    <div class="row">
      <input type="text" id="newChapterTitle" placeholder="New chapter title">
      <button class="ui primary" data-action="add-chapter" data-book="${esc(b.id)}">Add chapter</button>
    </div>
    <div class="row">
      <button class="ui" data-action="export-book" data-book="${esc(b.id)}">Export as Markdown</button>
      <button class="ui" data-action="delete-book" data-book="${esc(b.id)}">Delete book</button>
    </div>`;
}

/* ---------- news ---------- */

async function loadNews() {
  const get = async path => {
    try {
      const res = await fetch(path, { cache: "no-cache" });
      return res.ok ? await res.json() : null;
    } catch (e) { return null; }
  };
  const [topics, stories, feed] = await Promise.all([get("news/topics.json"), get("news/stories.json"), get("data/news.json")]);
  ui.news = {
    topics: Array.isArray(topics) ? topics : [],
    stories: Array.isArray(stories) ? stories : [],
    items: feed && Array.isArray(feed.items) ? feed.items : [],
    generatedAt: feed ? feed.generatedAt : null,
    failed: feed && Array.isArray(feed.failed) ? feed.failed : [],
  };
  if (ui.tab === "news") render();
}

function headlineHtml(i) {
  return `<a class="hl" href="${safeUrl(i.url)}" target="_blank" rel="noopener noreferrer"><span class="hl-src">${esc(i.source)}</span>${esc(i.title)}</a>`;
}

// Side-by-side columns by lean, so opposing headlines sit next to each other.
function columnsHtml(list) {
  if (!list.length) return `<div class="empty">No coverage yet.</div>`;
  const groups = { left: [], center: [], right: [], none: [] };
  list.forEach(i => { groups[LEAN_ORDER.includes(i.lean) ? i.lean : "none"].push(i); });
  const note = groups.left.length && groups.right.length ? "" : `<div class="muted">Coverage from only one side of the spectrum so far.</div>`;
  const cols = LEAN_ORDER.filter(k => groups[k].length).map(k => `
    <div class="col">
      <div class="col-head">${k === "none" ? "Unlabeled" : LEAN_LABEL[k]}</div>
      ${groups[k].map(headlineHtml).join("")}
    </div>`).join("");
  return `${note}<div class="cols">${cols}</div>`;
}

function newsHtml() {
  const n = ui.news;
  if (!n) return `<div class="section-label">News</div><div class="card"><div class="empty">Loading the feed…</div></div>`;
  const follow = state.news.follow;
  const shown = follow.length ? n.topics.filter(t => follow.includes(t.id)) : n.topics;
  const chips = n.topics.map(t => `<button class="chip-btn" aria-pressed="${follow.includes(t.id)}" data-action="follow" data-id="${esc(t.id)}">${esc(t.label)}</button>`).join("");
  const stories = n.stories.map(s => `
    <article class="card">
      <div class="muted">${esc(s.date || "")}${s.topic ? ` · ${esc(s.topic)}` : ""}</div>
      <h2>${esc(s.title)}</h2>
      ${s.summary ? `<p class="story-sum">${esc(s.summary)}</p>` : ""}
      ${columnsHtml(s.headlines || [])}
    </article>`).join("");
  const topicCards = shown.map(t => `
    <section class="card"><h2>${esc(t.label)}</h2>${columnsHtml(n.items.filter(i => (i.topics || []).includes(t.id)).slice(0, 15))}</section>`).join("");
  const updated = n.generatedAt ? new Date(n.generatedAt).toLocaleString() : "not yet";
  const failed = n.failed.length ? ` Unavailable right now: ${esc(n.failed.map(f => f.source).join(", "))}.` : "";
  return `
    <div class="section-label">News</div>
    <div class="section-sub">Each topic shows coverage from across the spectrum, side by side. Pick the topics you follow; the rest stay out of view.</div>
    <div class="card">
      <div class="chips">${chips || `<span class="empty">No topics configured yet.</span>`}</div>
      <div class="muted">${follow.length ? `Following ${follow.length} topic${follow.length === 1 ? "" : "s"}.` : "Following all topics. Pick some to narrow the view."}</div>
    </div>
    ${stories ? `<div class="section-label">Stories</div>${stories}` : ""}
    ${topicCards || `<div class="card"><div class="empty">No topics to show.</div></div>`}
    <div class="muted" style="text-align:center;margin-top:12px">Feed updated ${esc(updated)}.${failed}</div>`;
}

/* ---------- figures ---------- */

const figureDistance = (a, b) => Math.hypot(...Object.keys(COMPASS_AXES).map(k => a[k] - b[k]));
// Closeness on a 0 to 100 scale. The farthest two points can be is sqrt(20) apart on five dimensions.
const closeness = d => Math.max(0, Math.round(100 * (1 - d / Math.sqrt(20))));

function figuresHtml() {
  if (ui.figure !== null) return figureDetailHtml(ui.figure);
  const sc = compassScores();
  const complete = sc.answered === COMPASS_QUESTIONS.length;
  const near = complete
    ? FIGURES.map((f, i) => ({ f, i, d: figureDistance(f, sc) })).sort((a, b) => a.d - b.d).slice(0, 3)
    : [];
  return `
    <div class="section-label">Political figures</div>
    <div class="section-sub">Historical figures placed on the same five dimensions as the compass. Tap one to see who they are closest to.</div>
    ${near.length ? `<div class="card"><h2>Closest to you</h2>${near.map(n => `
      <div class="match"><button class="link" data-action="figure" data-id="${n.i}" style="margin:0;color:var(--ink);text-decoration:none">${esc(n.f.name)}</button><small>${closeness(n.d)}% close</small></div>`).join("")}</div>` : ""}
    <div class="card">${FIGURES.map((f, i) => `
      <div class="match"><button class="link" data-action="figure" data-id="${i}" style="margin:0;color:var(--ink);text-decoration:none">${esc(f.name)}</button><small>Tap to view</small></div>`).join("")}</div>`;
}

function figureDetailHtml(i) {
  const f = FIGURES[i];
  const closest = FIGURES
    .map((g, j) => ({ g, j, d: figureDistance(f, g) }))
    .filter(x => x.j !== i)
    .sort((a, b) => a.d - b.d)
    .slice(0, 5);
  return `
    <div class="row" style="margin-top:0"><button class="ui" data-action="figure-back">← All figures</button></div>
    <section class="card" style="margin-top:12px">
      <h2>${esc(f.name)}</h2>
      <div class="muted"><a href="${safeUrl(f.wiki)}" target="_blank" rel="noopener noreferrer">Read the reference article</a></div>
      ${readoutHtml(f)}
      <div class="muted" style="margin-top:12px">Closest figures</div>
      ${closest.map(c => `
        <div class="match"><button class="link" data-action="figure" data-id="${c.j}" style="margin:0;color:var(--ink);text-decoration:none">${esc(c.g.name)}</button><small>${closeness(c.d)}% close</small></div>`).join("")}
      <div class="muted" style="margin-top:12px">Placements are rough estimates from general knowledge, not measurements. Edit them in the app's source if you find them wrong.</div>
    </section>`;
}

/* ---------- guidance and backup text ---------- */

function startHereHtml() {
  return `
    <section class="card">
      <h2>Start here</h2>
      <p class="muted" style="margin-top:6px">1. Add an entry: something you made, something you read and want to think through, or a date you want to remember.</p>
      <p class="muted" style="margin-top:6px">2. Open Compass and answer the 20 statements about where you stand. Your answers stay on this device.</p>
      <p class="muted" style="margin-top:6px">3. Use Writing for longer work. The prompt card on each page helps you test your own views.</p>
      <p class="muted" style="margin-top:6px">4. Before switching devices, export a backup at the bottom of the page. Keep it somewhere safe.</p>
    </section>`;
}

function exportHtml() {
  return `
    <section class="card">
      <h2>Your backup</h2>
      <p class="muted" style="margin-top:6px">Copy this text into a note or a file named passport-backup.json and keep it safe. A file download may not work inside this page, so the text is here too.</p>
      <div class="row"><button class="ui primary" data-action="copy-export">Copy text</button><button class="ui" data-action="close-export">Close</button></div>
      <textarea id="exportBox" readonly style="width:100%;min-height:140px;margin-top:10px;font:12px ui-monospace,monospace;color:var(--ink);background:var(--parchment);border:0.5px solid var(--line-strong);border-radius:7px;padding:8px">${esc(ui.exportText)}</textarea>
    </section>`;
}

/* ---------- ponder: prompts and reading ---------- */

// Figures closest to the compass result, or a starter set until the compass is complete.
function ponderFigures() {
  const sc = compassScores();
  if (sc.answered === COMPASS_QUESTIONS.length) {
    return FIGURES
      .map(f => ({ ...f, reason: "Closest to your compass result", d: figureDistance(f, sc) }))
      .sort((a, b) => a.d - b.d)
      .slice(0, 3);
  }
  return FIGURES.slice(0, 3).map(f => ({ ...f, reason: "Finish the compass for a closer match" }));
}

function ponderHtml(label) {
  const prompt = PROMPTS[ui.promptIndex % PROMPTS.length];
  return `
    <section class="card">
      <div class="muted">${esc(label)}</div>
      <p class="story-sum" style="font-size:15px">${esc(prompt)}</p>
      <div class="row" style="margin-top:6px"><button class="ui" data-action="next-prompt">Another prompt</button></div>
      <div class="muted" style="margin-top:12px">Learn more about these figures</div>
      ${ponderFigures().map(f => `
        <div class="match"><a href="${safeUrl(f.wiki)}" target="_blank" rel="noopener noreferrer">${esc(f.name)}</a><small>${esc(f.reason)}</small></div>`).join("")}
      <div class="muted" style="margin-top:12px">Ideologies to read about</div>
      ${IDEOLOGIES.map(i => `
        <div class="match"><a href="${safeUrl(i.wiki)}" target="_blank" rel="noopener noreferrer">${esc(i.name)}</a><small>${esc(i.blurb)}</small></div>`).join("")}
    </section>`;
}

/* ---------- shell ---------- */

function render() {
  const body = { passport: passportHtml, compass: compassHtml, figures: figuresHtml, writing: writingHtml, news: newsHtml }[ui.tab]();
  app.innerHTML = `
    <header class="masthead">
      <h1>Passport</h1>
      <div class="sub">Kept on this device</div>
    </header>
    <nav class="tabs" role="tablist">
      ${TABS.map(t => `<button class="tab" role="tab" aria-selected="${ui.tab === t.id}" data-action="tab" data-id="${t.id}">${t.label}</button>`).join("")}
    </nav>
    ${ui.exportText ? exportHtml() : ""}
    ${body}
    <footer class="foot">
      <p>To move everything between devices, export a backup on one and import it on the other.</p>
      <div class="row">
        <button class="ui" data-action="export">Export backup</button>
        <button class="ui" data-action="import">Import backup</button>
        <button class="ui" data-action="print">Print</button>
        <button class="ui" data-action="theme">${isDark() ? "Light" : "Dark"}</button>
      </div>
    </footer>`;
  const search = document.getElementById("search");
  if (search) search.addEventListener("input", e => { ui.query = e.target.value; keepFocus(e.target, render); });
  const bookSearch = document.getElementById("bookSearch");
  if (bookSearch) bookSearch.addEventListener("input", e => { ui.bookQuery = e.target.value; keepFocus(e.target, render); });
}

function keepFocus(el, redraw) {
  const pos = el.selectionStart;
  redraw();
  const again = el.id ? document.getElementById(el.id) : null;
  if (again) { again.focus(); again.setSelectionRange(pos, pos); }
}

/* ---------- backup ---------- */

function download(name, text, type) {
  const blob = new Blob([text], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function exportBook(id) {
  const b = state.books.find(x => x.id === id);
  if (!b) return;
  const md = [`# ${b.title}`, ""].concat(b.chapters.flatMap(c => [`## ${c.title}`, "", c.body.trim(), ""])).join("\n");
  const slug = b.title.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "book";
  download(`${slug}.md`, md, "text/markdown");
}

async function importFile(file) {
  let data;
  try { data = JSON.parse(await file.text()); } catch (e) { data = null; }
  if (!data || data.app !== APP_ID || !data.state) return alert("That file isn't a backup from this app.");
  if (!confirm("Replace everything on this device with this backup?")) return;
  state = normalize(data.state);
  persist();
  render();
  toast("Backup restored");
}

/* ---------- events ---------- */

document.addEventListener("click", async e => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const d = el.dataset;
  switch (d.action) {
    case "tab":
      ui.tab = d.id;
      render();
      if (d.id === "news" && !ui.news) loadNews();
      break;
    case "filter": ui.filter = d.id; render(); break;
    case "next-prompt": ui.promptIndex += 1; render(); break;
    case "figure": ui.figure = Number(d.id); render(); break;
    case "figure-back": ui.figure = null; render(); break;
    case "q-prev": ui.qIndex = Math.max(0, currentQIndex() - 1); render(); break;
    case "q-next": ui.qIndex = Math.min(COMPASS_QUESTIONS.length - 1, currentQIndex() + 1); render(); break;
    case "compose": ui.composing = true; ui.editing = null; render(); break;
    case "edit": ui.editing = d.id; ui.composing = false; render(); break;
    case "cancel": ui.composing = false; ui.editing = null; render(); break;
    case "save": saveEntry(); break;
    case "delete": removeEntry(d.id); break;
    case "compass-reset":
      if (confirm("Clear all compass answers?")) { state.compass = {}; persist(); render(); }
      break;
    case "follow": {
      const f = state.news.follow;
      const at = f.indexOf(d.id);
      if (at >= 0) f.splice(at, 1); else f.push(d.id);
      persist();
      render();
      break;
    }
    case "open-book": ui.openBook = d.id; render(); break;
    case "close-book": ui.openBook = null; render(); break;
    case "add-book": {
      const title = document.getElementById("newBookTitle").value.trim();
      if (!title) return;
      state.books.push({ id: uid(), title, chapters: [] });
      persist();
      render();
      toast("Book started");
      break;
    }
    case "delete-book":
      if (confirm("Delete this book and all its chapters?")) {
        state.books = state.books.filter(b => b.id !== d.book);
        ui.openBook = null;
        persist();
        render();
      }
      break;
    case "add-chapter": {
      const title = document.getElementById("newChapterTitle").value.trim();
      if (!title) return;
      const b = state.books.find(x => x.id === d.book);
      if (b) b.chapters.push({ id: uid(), title, body: "" });
      persist();
      render();
      break;
    }
    case "delete-chapter":
      if (confirm("Delete this chapter?")) {
        const b = state.books.find(x => x.id === d.book);
        if (b) b.chapters = b.chapters.filter(c => c.id !== d.id);
        persist();
        render();
      }
      break;
    case "export-book": exportBook(d.book); break;
    case "export": {
      const payload = { app: APP_ID, version: 1, exportedAt: new Date().toISOString(), state };
      ui.exportText = JSON.stringify(payload, null, 2);
      download(`passport-${new Date().toISOString().slice(0, 10)}.json`, ui.exportText, "application/json");
      render();
      break;
    }
    case "copy-export": {
      const box = document.getElementById("exportBox");
      try {
        await navigator.clipboard.writeText(ui.exportText);
        toast("Copied");
      } catch (err) {
        box.select();
        toast("Press Ctrl+C or long-press to copy");
      }
      break;
    }
    case "close-export": ui.exportText = null; render(); break;
    case "import": document.getElementById("importFile").click(); break;
    case "print": window.print(); break;
    case "theme":
      document.documentElement.dataset.theme = isDark() ? "light" : "dark";
      render();
      break;
  }
});

document.addEventListener("change", e => {
  const el = e.target;
  const d = el.dataset;
  if (!d.field) return;
  switch (d.field) {
    case "compass": {
      const at = COMPASS_QUESTIONS.findIndex(q => q.id === Number(d.id));
      state.compass[d.id] = Number(el.value);
      ui.qIndex = Math.min(at + 1, COMPASS_QUESTIONS.length - 1);
      persist();
      render();
      break;
    }
    case "chapter-title": {
      const b = state.books.find(x => x.id === d.book);
      const c = b && b.chapters.find(x => x.id === d.id);
      if (c) c.title = el.value.trim() || "Untitled";
      persist();
      break;
    }
    case "chapter-body": {
      const b = state.books.find(x => x.id === d.book);
      const c = b && b.chapters.find(x => x.id === d.id);
      if (c) c.body = el.value;
      persist();
      render();
      break;
    }
  }
});

document.getElementById("importFile").addEventListener("change", e => {
  const file = e.target.files[0];
  e.target.value = "";
  if (file) importFile(file);
});

render();
if (ui.tab === "news") loadNews();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
